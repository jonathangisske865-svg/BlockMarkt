<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blockmarkt – Minecraft Item-Shop</title>
<style>
:root{
  --page:#e9e4d6;--ink:#1f1f1f;--muted:#555;--panel:#c6c6c6;--slot:#8b8b8b;--slot-hi:#fff;--slot-lo:#373737;
  --grass:#4f8f2f;--grass-ink:#fff;--gem:#17b954;--bar:#3b2a1a;--bar-ink:#f4ead7;--field:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#17181a;--ink:#ececec;--muted:#aaa;--panel:#3a3b3e;--slot:#26272a;--slot-hi:#5a5b60;--slot-lo:#0d0d0e;
  --grass:#5fb03a;--grass-ink:#0f1a08;--gem:#2fe27a;--bar:#0f0f10;--bar-ink:#e8e2d2;--field:#1d1e20;}}
:root[data-theme="dark"]{
  --page:#17181a;--ink:#ececec;--muted:#aaa;--panel:#3a3b3e;--slot:#26272a;--slot-hi:#5a5b60;--slot-lo:#0d0d0e;
  --grass:#5fb03a;--grass-ink:#0f1a08;--gem:#2fe27a;--bar:#0f0f10;--bar-ink:#e8e2d2;--field:#1d1e20;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,.px{font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;font-weight:400;line-height:1.5}
header{background:var(--bar);color:var(--bar-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:4px solid var(--grass)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
.bar{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:clamp(14px,3.4vw,20px);margin:0}
.cartbtn{font:inherit;background:var(--grass);color:var(--grass-ink);border:0;padding:10px 14px;cursor:pointer;box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.35)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);padding:16px;box-shadow:inset 3px 3px 0 var(--slot-hi),inset -3px -3px 0 var(--slot-lo);color:var(--ink)}
.panel h2{font-size:13px;margin:0 0 12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
input[type=search],input[type=text]{font:inherit;color:var(--ink);background:var(--field);border:0;padding:9px 10px;min-width:0;flex:1 1 160px;box-shadow:inset 2px 2px 0 var(--slot-lo),inset -2px -2px 0 var(--slot-hi)}
.tab{font:inherit;font-size:14px;color:var(--ink);background:var(--slot);border:0;padding:8px 12px;cursor:pointer;box-shadow:inset 2px 2px 0 var(--slot-hi),inset -2px -2px 0 var(--slot-lo)}
.tab[aria-pressed=true]{background:var(--grass);color:var(--grass-ink);font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--gem);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{background:var(--slot);padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;box-shadow:inset 3px 3px 0 var(--slot-lo),inset -3px -3px 0 var(--slot-hi)}
.ico{font-size:40px;line-height:1.2}
.name{font-weight:700;font-size:15px}
.price{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink)}
.gem{width:12px;height:12px;border-radius:50%;background:#d9a441;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3);display:inline-block;flex:none}
.add{font:inherit;font-size:14px;margin-top:4px;width:100%;background:var(--grass);color:var(--grass-ink);border:0;padding:7px;cursor:pointer;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3),inset 2px 2px 0 rgba(255,255,255,.35)}
.add:active,.cartbtn:active{transform:translateY(2px)}
.sub{font-size:12px;color:var(--ink)}
.empty{grid-column:1/-1;padding:24px;text-align:center;color:var(--muted)}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:820px){aside{position:static}}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:2px solid var(--slot)}
.row .t{font-size:14px;line-height:1.3}
.qty{display:flex;align-items:center;gap:4px}
.qty button{font:inherit;width:26px;height:26px;border:0;background:var(--slot);color:var(--ink);cursor:pointer;box-shadow:inset 2px 2px 0 var(--slot-hi),inset -2px -2px 0 var(--slot-lo)}
.qty span{min-width:22px;text-align:center}
.total{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px;font-weight:700}
.field{display:flex;gap:8px;margin-bottom:10px}
.go{font:inherit;width:100%;background:var(--grass);color:var(--grass-ink);border:0;padding:12px;font-weight:700;cursor:pointer;box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.35)}
.go:disabled{opacity:.5;cursor:not-allowed}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
dialog{border:0;padding:0;max-width:min(560px,92vw);width:100%;background:transparent;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .panel{max-height:85vh;overflow:auto}
textarea{width:100%;min-height:160px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--field);color:var(--ink);border:0;padding:10px;box-shadow:inset 2px 2px 0 var(--slot-lo),inset -2px -2px 0 var(--slot-hi);resize:vertical;overflow-x:auto;white-space:pre}
.btns{display:flex;gap:8px;margin-top:10px}
.btns button{flex:1}
.sec{background:var(--slot);color:var(--ink)}
:root:root:root{--page:#eaeded;--ink:#0f1111;--muted:#565959;--panel:#fff;--slot:#f7f8f8;--slot-hi:#fff;--slot-lo:#d5d9d9;--field:#fff;--grass:#ffd814;--grass-ink:#0f1111;--gem:#ff9900;--bar:#131921;--bar-ink:#fff;color-scheme:light}
body{font-family:Arial,"Helvetica Neue",system-ui,sans-serif;font-size:14px}
h1,h2{font-family:inherit;font-weight:700}
header{border-bottom:0}
.bar{max-width:1400px;gap:16px}
.logo{font-size:24px;letter-spacing:-.5px;color:#fff;white-space:nowrap}
.logo b{color:#ff9900}
.search{display:flex;flex:1;min-width:0}
.search input[type=search]{flex:1;height:42px;border-radius:6px 0 0 6px;box-shadow:none;padding:0 12px;font-size:15px;background:#fff;color:#0f1111}
.sbtn{width:46px;border:0;border-radius:0 6px 6px 0;background:#febd69;cursor:pointer;font-size:16px}
.cartbtn{background:transparent;color:#fff;box-shadow:none;font-weight:700;font-size:15px;padding:8px;border-radius:2px;white-space:nowrap}
.cartbtn:hover{outline:1px solid #fff}
#cnt{color:#f08804}
.nav{background:#232f3e}
.navin{max-width:1400px;margin:0 auto;padding:2px 12px;display:flex;gap:2px;overflow-x:auto}
.tab{background:transparent;color:#fff;box-shadow:none;border:1px solid transparent;border-radius:2px;padding:8px 10px;font-weight:400;white-space:nowrap}
.tab:hover{border-color:#fff}
.tab[aria-pressed=true]{background:transparent;color:#fff;font-weight:700;border-bottom:3px solid #ff9900}
@media (max-width:640px){.bar{flex-wrap:wrap}.search{order:3;flex-basis:100%}}
.wrap{max-width:1400px;padding:16px}
.res{font-size:18px;margin:0 0 12px}
.panel{box-shadow:none;border-radius:8px;border:1px solid #ddd;background:#fff}
.panel h2{font-size:18px}
aside{top:calc(env(safe-area-inset-top,0px) + 120px)}
.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.item{background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:none;padding:0;text-align:left;align-items:stretch;gap:6px;overflow:hidden}
.item .ico{background:#f7f8f8;padding:20px 0;text-align:center;font-size:56px}
.item .name{margin:0 12px;color:#007185;font-weight:400;font-size:15px;line-height:1.3}
.item .price{margin:0 12px;font-size:20px;font-weight:700;display:flex;align-items:baseline;gap:6px}
.item .gem,.total .gem{width:14px;height:14px;align-self:center}
.item .sub{margin:0 12px;color:var(--muted)}
.item .add{width:auto;margin:4px 12px 12px;border-radius:20px;background:#ffd814;color:#0f1111;box-shadow:none;border:1px solid #fcd200;padding:8px;font-size:13px}
.item .add:hover{background:#f7ca00}
.total{font-size:18px}
.row{border-bottom:1px solid #e7e7e7}
.qty button{border:1px solid #d5d9d9;border-radius:8px;background:#f0f2f2;box-shadow:none}
input[type=text]{border:1px solid #888;border-radius:4px;box-shadow:none}
.go{background:#ffa41c;border:1px solid #ff8f00;border-radius:20px;box-shadow:none;color:#0f1111;font-weight:400}
.go.sec{background:#fff;border-color:#d5d9d9}
button:focus-visible,input:focus-visible{outline:3px solid #ff9900}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 class="logo">Block<b>markt</b></h1>
    <div class="search"><input type="search" id="q" placeholder="Items suchen" aria-label="Items suchen"><button class="sbtn" type="button" aria-label="Suchen" onclick="document.getElementById('q').focus()">🔍</button></div>
    <button class="cartbtn" id="jump" type="button">🛒 Warenkorb (<span id="cnt">0</span>)</button>
  </div>
  <nav class="nav"><div class="navin" id="tabs"></div></nav>
</header>

<div class="wrap">
  <main>
    <h2 class="res">Ergebnisse</h2>
    <div class="grid" id="grid"></div>
  </main>

  <aside class="panel" id="cart">
    <h2>Warenkorb</h2>
    <div id="rows"></div>
    <div class="total"><span>Gesamt</span><span class="price"><span class="gem"></span><span id="sum">0</span> Spur</span></div><p class="note" id="coinsum" style="margin:-6px 0 10px">Entspricht: 0</p>
    <div class="field"><input type="text" id="player" placeholder="Dein Spielername" aria-label="Dein Spielername" maxlength="16" autocomplete="off"></div>
    <button class="go" id="order" type="button" disabled>Jetzt bestellen</button>
    <p class="note">Preise in den Münzen von Create: Numismatics. Nach der Bestellung bekommst du die Befehle für den Admin.</p>
  </aside>
</div>

<dialog id="dlg">
  <div class="panel">
    <h2>Bestellung <span id="oid"></span></h2>
    <p id="osum" style="margin:0 0 10px"></p>
    <textarea id="cmds" readonly aria-label="Give-Befehle"></textarea>
    <div class="btns">
      <button class="go" id="copy" type="button">Befehle kopieren</button>
      <button class="go sec" id="close" type="button">Schließen</button>
    </div>
    <p class="note">Zahle den Betrag in Münzen oder per Karte. Die Befehle führt ein Admin im Spiel aus.</p>
  </div>
</dialog>

<script>
var ITEMS=[

];
var CATS=["Alle","Waffen","Werkzeuge","Essen","Besonderes","Blöcke","Erze","Redstone","Farmen","Magie","Rüstung","Create"];
var MORE=[

["Blöcke","🧱","","cobblestone|Bruchstein|1;stone|Stein|1;stone_bricks|Steinziegel|1;deepslate|Tiefenschiefer|1;dirt|Erde|1;sand|Sand|1;gravel|Kies|1;glass|Glas|1;oak_planks|Eichenbretter|1;oak_log|Eichenstamm|1;spruce_log|Fichtenstamm|1;birch_log|Birkenstamm|1;bricks|Ziegel|2;sandstone|Sandstein|1;terracotta|Terrakotta|2;white_wool|Weiße Wolle|2;white_concrete|Weißer Beton|2;obsidian|Obsidian|4;quartz_block|Quarzblock|4;netherrack|Netherrack|1;end_stone|Endstein|2;prismarine|Prismarin|3;glowstone|Glowstone|4;sea_lantern|Seelaterne|5;lantern|Laterne|3;torch|Fackel|1;ladder|Leiter|1;scaffolding|Gerüst|2;oak_door|Eichentür|2;chest|Truhe|3;barrel|Fass|3;crafting_table|Werkbank|2;furnace|Ofen|2;bookshelf|Bücherregal|5;anvil|Amboss|10;enchanting_table|Zaubertisch|30;ender_chest|Endertruhe|25;shulker_box|Shulkerkiste|30;red_bed|Bett|5"],
["Erze","🪨","","coal|Kohle|2;iron_ingot|Eisenbarren|3;gold_ingot|Goldbarren|5;copper_ingot|Kupferbarren|2;emerald|Smaragd|6;lapis_lazuli|Lapislazuli|2;redstone|Redstone|2;quartz|Netherquarz|2;amethyst_shard|Amethystscherbe|3;raw_iron|Roheisen|2;raw_gold|Rohgold|3;raw_copper|Rohkupfer|1;ancient_debris|Antiker Schutt|35;netherite_scrap|Netheritschrott|25;coal_block|Kohleblock|18;iron_block|Eisenblock|27;gold_block|Goldblock|45;emerald_block|Smaragdblock|54;diamond_block|Diamantblock|160;netherite_block|Netheriteblock|270"],
["Redstone","🔴","","redstone_torch|Redstone-Fackel|2;repeater|Verstärker|4;comparator|Komparator|6;piston|Kolben|5;sticky_piston|Klebriger Kolben|7;observer|Beobachter|6;hopper|Trichter|6;dropper|Werfer|4;dispenser|Spender|5;lever|Hebel|1;stone_button|Steinknopf|1;redstone_lamp|Redstone-Lampe|6;slime_block|Schleimblock|12;honey_block|Honigblock|10;rail|Schiene|1;powered_rail|Antriebsschiene|4;detector_rail|Sensorschiene|3;minecart|Lore|6;target|Zielblock|5;daylight_detector|Tageslichtsensor|7;note_block|Notenblock|4"],
["Farmen","🌾","","wheat_seeds|Weizensamen|1;wheat|Weizen|1;carrot|Karotte|1;potato|Kartoffel|1;pumpkin|Kürbis|2;melon_slice|Melonenscheibe|1;sugar_cane|Zuckerrohr|1;bamboo|Bambus|1;cactus|Kaktus|1;oak_sapling|Eichensetzling|1;bone_meal|Knochenmehl|1;hay_block|Heuballen|6;cocoa_beans|Kakaobohnen|2;apple|Apfel|2;honey_bottle|Honigflasche|4;egg|Ei|1;milk_bucket|Milcheimer|4;water_bucket|Wassereimer|4;lava_bucket|Lavaeimer|6;bucket|Eimer|3;name_tag|Namensschild|10;saddle|Sattel|12;lead|Leine|3"],
["Magie","🧪","","experience_bottle|Erfahrungsfläschchen|6;glass_bottle|Glasflasche|1;blaze_rod|Lohenrute|6;blaze_powder|Lohenpulver|3;ghast_tear|Ghast-Träne|15;nether_wart|Netherwarze|3;spider_eye|Spinnenauge|2;magma_cream|Magmacreme|4;brewing_stand|Braustand|10;cauldron|Kessel|6;enchanted_golden_apple|Verzauberter Goldener Apfel|120;ender_eye|Endauge|12;firework_rocket|Feuerwerksrakete|3;nautilus_shell|Nautilusschale|20;heart_of_the_sea|Herz des Meeres|50;nether_star|Netherstern|150;book|Buch|3"],
["Rüstung","🪖","","iron_helmet|Eisenhelm|10;iron_chestplate|Eisenbrustpanzer|16;iron_leggings|Eisenbeinschutz|14;iron_boots|Eisenschuhe|8;diamond_helmet|Diamanthelm|30;diamond_chestplate|Diamantbrustpanzer|48;diamond_leggings|Diamantbeinschutz|42;diamond_boots|Diamantschuhe|24;netherite_helmet|Netheritehelm|55;netherite_chestplate|Netheritebrustpanzer|75;netherite_leggings|Netheritebeinschutz|68;netherite_boots|Netheriteschuhe|50;turtle_helmet|Schildkrötenpanzer|12"],
["Create","⚙️","create:","cogwheel|Zahnrad|3;large_cogwheel|Großes Zahnrad|4;shaft|Welle|2;andesite_alloy|Andesitlegierung|2;brass_ingot|Messingbarren|5;zinc_ingot|Zinkbarren|3;brass_sheet|Messingblech|6;copper_sheet|Kupferblech|3;iron_sheet|Eisenblech|4;precision_mechanism|Präzisionsmechanismus|20;andesite_casing|Andesitgehäuse|4;brass_casing|Messinggehäuse|8;copper_casing|Kupfergehäuse|5;gearbox|Getriebe|6;clutch|Kupplung|6;gearshift|Schaltgetriebe|6;hand_crank|Handkurbel|4;water_wheel|Wasserrad|8;windmill_bearing|Windmühlenlager|12;mechanical_bearing|Mechanisches Lager|10;steam_engine|Dampfmaschine|30;encased_fan|Ummantelter Ventilator|10;mechanical_press|Mechanische Presse|14;mechanical_mixer|Mechanischer Mixer|16;mechanical_drill|Mechanischer Bohrer|12;mechanical_saw|Mechanische Säge|12;deployer|Deployer|24;mechanical_arm|Mechanischer Arm|40;basin|Becken|6;blaze_burner|Lohenbrenner|20;depot|Depot|4;millstone|Mühlstein|8;crushing_wheel|Brechrad|14;fluid_pipe|Flüssigkeitsrohr|3;mechanical_pump|Mechanische Pumpe|10;fluid_tank|Flüssigkeitstank|10;chute|Rutsche|3;wrench|Schraubenschlüssel|6;goggles|Ingenieursbrille|8;super_glue|Superkleber|6"]
];
MORE.forEach(function(g){g[3].split(";").forEach(function(s){var f=s.split("|");ITEMS.push([g[2]+f[0],f[1],g[1],g[0],+f[2]])})});
var cat="Alle",term="",cart={};
var $=function(i){return document.getElementById(i)};
function byId(id){for(var i=0;i<ITEMS.length;i++)if(ITEMS[i][0]===id)return ITEMS[i]}
var F=4,COINS=[["Sun",4096],["Crown",512],["Cog",64],["Sprocket",16],["Bevel",8],["Spur",1]];
function cost(it){return it[4]*F}
function coins(n){var o=[];COINS.forEach(function(c){var k=Math.floor(n/c[1]);if(k){o.push(k+" "+c[0]);n-=k*c[1]}});return o.join(" + ")||"0"}

function drawTabs(){
  var t=$("tabs");t.textContent="";
  CATS.forEach(function(c){
    var b=document.createElement("button");b.type="button";b.className="tab";b.textContent=c;
    b.setAttribute("aria-pressed",c===cat);
    b.onclick=function(){cat=c;drawTabs();drawGrid()};
    t.appendChild(b);
  });
}
function drawGrid(){
  var g=$("grid");g.textContent="";var n=0;
  ITEMS.forEach(function(it){
    if(cat!=="Alle"&&it[3]!==cat)return;
    if(term&&it[1].toLowerCase().indexOf(term)<0)return;
    n++;
    var d=document.createElement("div");d.className="item";
    var ic=document.createElement("div");ic.className="ico";ic.textContent=it[2];
    var nm=document.createElement("div");nm.className="name";nm.textContent=it[1];
    var pr=document.createElement("div");pr.className="price";
    var gm=document.createElement("span");gm.className="gem";
    var pt=document.createElement("span");pt.textContent=cost(it)+" Spur";var sb=document.createElement("div");sb.className="sub";sb.textContent=coins(cost(it));
    pr.appendChild(gm);pr.appendChild(pt);
    var ad=document.createElement("button");ad.type="button";ad.className="add";ad.textContent="In den Warenkorb";
    ad.onclick=function(){cart[it[0]]=(cart[it[0]]||0)+1;drawCart()};
    d.appendChild(ic);d.appendChild(nm);d.appendChild(pr);d.appendChild(sb);d.appendChild(ad);g.appendChild(d);
  });
  if(!n){var e=document.createElement("div");e.className="empty";e.textContent="Nichts gefunden. Probier einen anderen Suchbegriff oder eine andere Kategorie.";g.appendChild(e)}
}
function drawCart(){
  var r=$("rows");r.textContent="";var sum=0,cnt=0,ids=Object.keys(cart);
  if(!ids.length){var e=document.createElement("p");e.className="note";e.textContent="Noch leer. Füge links Items hinzu.";r.appendChild(e)}
  ids.forEach(function(id){
    var it=byId(id),q=cart[id];sum+=cost(it)*q;cnt+=q;
    var row=document.createElement("div");row.className="row";
    var ic=document.createElement("span");ic.textContent=it[2];ic.style.fontSize="22px";
    var tx=document.createElement("div");tx.className="t";tx.textContent=it[1]+" · "+(cost(it)*q)+" Spur";
    var qt=document.createElement("div");qt.className="qty";
    var m=document.createElement("button");m.type="button";m.textContent="−";m.setAttribute("aria-label",it[1]+" weniger");
    var s=document.createElement("span");s.textContent=q;
    var p=document.createElement("button");p.type="button";p.textContent="+";p.setAttribute("aria-label",it[1]+" mehr");
    m.onclick=function(){cart[id]--;if(cart[id]<1)delete cart[id];drawCart()};
    p.onclick=function(){cart[id]++;drawCart()};
    var q8=document.createElement("button");q8.type="button";q8.textContent="+8";q8.style.width="34px";q8.setAttribute("aria-label",it[1]+" plus 8");q8.onclick=function(){cart[id]+=8;drawCart()};
    qt.appendChild(m);qt.appendChild(s);qt.appendChild(p);qt.appendChild(q8);
    row.appendChild(ic);row.appendChild(tx);row.appendChild(qt);r.appendChild(row);
  });
  $("sum").textContent=sum;$("coinsum").textContent="Entspricht: "+coins(sum);$("cnt").textContent=cnt;$("order").disabled=!cnt;
}
$("q").oninput=function(){term=this.value.trim().toLowerCase();drawGrid()};
$("jump").onclick=function(){$("cart").scrollIntoView({behavior:"smooth",block:"start"})};
$("order").onclick=function(){
  var name=$("player").value.replace(/[^A-Za-z0-9_]/g,"")||"@p";
  var lines=[],sum=0,cnt=0;
  Object.keys(cart).forEach(function(id){
    lines.push("/give "+name+" "+(id.indexOf(":")<0?"minecraft:":"")+id+" "+cart[id]);
    sum+=cost(byId(id))*cart[id];cnt+=cart[id];
  });
  $("oid").textContent="#"+Math.floor(1000+Math.random()*9000);
  $("osum").textContent=cnt+" Items für "+sum+" Spur ("+coins(sum)+")"+(name==="@p"?" (ohne Spielername: nächster Spieler)":" für "+name)+".";
  $("cmds").value=lines.join("\n");
  $("dlg").showModal();
};
$("copy").onclick=function(){
  var ta=$("cmds"),b=this;ta.select();
  var done=function(){b.textContent="Kopiert";setTimeout(function(){b.textContent="Befehle kopieren"},1600)};
  try{if(navigator.clipboard){navigator.clipboard.writeText(ta.value).then(done,function(){document.execCommand("copy");done()})}else{document.execCommand("copy");done()}}catch(e){}
};
$("close").onclick=function(){$("dlg").close();cart={};drawCart()};
drawTabs();drawGrid();drawCart();
</script>
</body>
</html>
